<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GhostDB flow</title>
  <desc id="desc">Command enters the CLI, changes live memory and can be protected by nested transaction layers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="1" stop-color="#17142D"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#6D5DFB"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6EE7C7"/>
      <stop offset="1" stop-color="#22C7A0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7C75B9"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1060" cy="-20" r="190" fill="#6D5DFB" opacity=".12"/>
  <circle cx="90" cy="430" r="220" fill="#22C7A0" opacity=".08"/>

  <text x="56" y="58" fill="#F6F5FF" font-family="Inter,Segoe UI,sans-serif" font-size="24" font-weight="700">GhostDB · command → state → transaction</text>
  <text x="56" y="87" fill="#A9A6C8" font-family="Inter,Segoe UI,sans-serif" font-size="15">Every command is visible, and every change can be committed or rolled back.</text>

  <g transform="translate(58 132)">
    <rect width="260" height="186" rx="20" fill="#151B32" stroke="#343B68"/>
    <circle cx="32" cy="34" r="16" fill="#6D5DFB" opacity=".2"/>
    <text x="32" y="40" text-anchor="middle" fill="#BDAEFF" font-family="monospace" font-size="17">&gt;_</text>
    <text x="28" y="76" fill="#F6F5FF" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">CLI input</text>
    <text x="28" y="108" fill="#8F8AAC" font-family="monospace" font-size="14">SET A 10</text>
    <text x="28" y="136" fill="#8F8AAC" font-family="monospace" font-size="14">BEGIN</text>
    <text x="28" y="164" fill="#8F8AAC" font-family="monospace" font-size="14">ROLLBACK</text>
  </g>

  <path d="M338 225H424" stroke="#7C75B9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="381" y="208" text-anchor="middle" fill="#7773A5" font-family="Inter,Segoe UI,sans-serif" font-size="12">process()</text>

  <g transform="translate(454 132)">
    <rect width="292" height="186" rx="20" fill="#151B32" stroke="#343B68"/>
    <circle cx="34" cy="34" r="16" fill="#22C7A0" opacity=".2"/>
    <path d="M26 34h16M34 26v16" stroke="#6EE7C7" stroke-width="2" stroke-linecap="round"/>
    <text x="28" y="76" fill="#F6F5FF" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">Live memory</text>
    <text x="28" y="108" fill="#6EE7C7" font-family="monospace" font-size="14">db = { A: 10 }</text>
    <text x="28" y="136" fill="#A9A6C8" font-family="monospace" font-size="14">counts = { 10: 1 }</text>
    <text x="28" y="164" fill="#A9A6C8" font-family="monospace" font-size="14">transactions = [ ]</text>
  </g>

  <path d="M766 225H852" stroke="#7C75B9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="809" y="208" text-anchor="middle" fill="#7773A5" font-family="Inter,Segoe UI,sans-serif" font-size="12">state layer</text>

  <g transform="translate(882 132)">
    <rect width="260" height="186" rx="20" fill="#151B32" stroke="#343B68"/>
    <rect x="28" y="22" width="204" height="34" rx="10" fill="#6D5DFB" opacity=".18"/>
    <text x="44" y="44" fill="#C4B8FF" font-family="monospace" font-size="13">T1 · parent</text>
    <rect x="28" y="66" width="204" height="34" rx="10" fill="#22C7A0" opacity=".15"/>
    <text x="44" y="88" fill="#7DE7CB" font-family="monospace" font-size="13">T2 · nested</text>
    <text x="28" y="132" fill="#F6F5FF" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">Transaction stack</text>
    <text x="28" y="162" fill="#A9A6C8" font-family="Inter,Segoe UI,sans-serif" font-size="13">COMMIT · ROLLBACK · COMMIT</text>
  </g>

  <g filter="url(#glow)">
    <circle cx="338" cy="225" r="4" fill="#A78BFA"/>
    <circle cx="766" cy="225" r="4" fill="#6EE7C7"/>
  </g>
</svg>
